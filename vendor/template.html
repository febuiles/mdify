<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #B44E5D;
      --color-primary-hover: #A04553;
      --color-bg: #F8F3EC;
      --color-surface: #F2EDE6;
      --color-border: #E8E4E0;
      --color-text: #1A1918;
      --color-text-soft: #4A4846;
      --color-muted: #999590;
      --serif: 'IBM Plex Serif', Georgia, serif;
      --mono: 'Monaco', 'Menlo', 'Courier New', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--color-bg);
      color: var(--color-text-soft);
    }

    body {
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.8;
      padding: 40px 20px;
    }

    .reader-article {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 24px;
    }

    .reader-header {
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--color-border);
    }

    .reader-meta {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--color-muted);
    }

    .reader-content > h1:first-child,
    .reader-content > h2:first-child {
      margin-top: 0;
    }

    .reader-content p {
      margin: 0 0 20px 0;
    }

    .reader-content h1,
    .reader-content h2,
    .reader-content h3,
    .reader-content h4,
    .reader-content h5,
    .reader-content h6 {
      margin: 32px 0 16px 0;
      font-weight: 600;
      line-height: 1.4;
      color: var(--color-text);
    }

    .reader-content h1 { font-size: 28px; }
    .reader-content h2 { font-size: 24px; }
    .reader-content h3 { font-size: 20px; }
    .reader-content h4 { font-size: 18px; }
    .reader-content h5,
    .reader-content h6 { font-size: 16px; }

    .reader-content ul,
    .reader-content ol {
      margin: 0 0 20px 0;
      padding-left: 28px;
    }

    .reader-content li {
      margin-bottom: 8px;
    }

    .reader-content blockquote {
      margin: 24px 0;
      padding: 16px 24px;
      border-left: 4px solid var(--color-primary);
      background-color: var(--color-surface);
      font-style: italic;
      color: var(--color-text-soft);
    }

    .reader-content blockquote p:last-child { margin-bottom: 0; }

    .reader-content pre {
      margin: 20px 0;
      padding: 16px;
      background-color: var(--color-surface);
      border-radius: 6px;
      overflow-x: auto;
      font-size: 15px;
      line-height: 1.5;
    }

    .reader-content code {
      font-family: var(--mono);
      font-size: 0.9em;
      background-color: var(--color-surface);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .reader-content pre code {
      background-color: transparent;
      padding: 0;
      font-size: 1em;
    }

    .reader-content img {
      max-width: 100%;
      height: auto;
      margin: 24px 0;
      border-radius: 4px;
    }

    .reader-content a {
      color: var(--color-primary);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .reader-content a:hover {
      color: var(--color-primary-hover);
      text-decoration: underline;
    }

    .reader-content hr {
      border: 0;
      border-top: 1px solid var(--color-border);
      margin: 32px 0;
    }

    .reader-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 17px;
    }

    .reader-content th,
    .reader-content td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-border);
      text-align: left;
    }

    .reader-content th {
      font-weight: 600;
      color: var(--color-text);
      background-color: var(--color-surface);
    }

    .reader-content del {
      color: var(--color-muted);
    }

    .reader-content kbd {
      font-family: var(--mono);
      font-size: 0.85em;
      padding: 2px 6px;
      border: 1px solid var(--color-border);
      border-radius: 3px;
      background-color: var(--color-surface);
    }
  </style>
</head>
<body>
  <article class="reader-article">
    <header class="reader-header">
      <div class="reader-meta">{{ title }}</div>
    </header>
    <div class="reader-content">
      {{ body }}
    </div>
  </article>
</body>
</html>
